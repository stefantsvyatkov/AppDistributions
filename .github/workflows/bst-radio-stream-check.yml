name: BST Radio stream check

# Every night, before BST Radio's catalogue is made (04:17 UTC): bst-radio/check_streams.py plays every stream of
# Radio Browser for a second and keeps the days each one failed. The record goes to the "bst-radio-health" release,
# where the catalogue build reads it and leaves out a stream that has not played on five days in a row. It runs in
# this public repository because its Actions minutes are free; it needs no secret.

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bst-radio/check_streams.py
      - .github/workflows/bst-radio-stream-check.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: bst-radio-stream-check

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: bst-radio-health
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Fetch the last record
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern stream-health.json.gz --dir previous \
            || echo "::notice::No earlier record; a new one is started."

      - name: Play every stream
        run: python3 bst-radio/check_streams.py --previous previous/stream-health.json.gz --out stream-health.json.gz --report dead-streams.txt --review review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the record
        run: |
          gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "BST Radio stream health" \
                 --notes "Which of Radio Browser's streams play, checked every night by bst-radio/check_streams.py."
          gh release upload "$TAG" stream-health.json.gz dead-streams.txt --repo "$REPO" --clobber

      # The user's reminder (2026-09-29): when streams newly reach five days, an issue assigned to the owner, which
      # GitHub e-mails. While one is open it is only brought up to date (no e-mail); closing it after the review
      # lets the next new ones open another.
      - name: Tell the owner when new streams reach five days
        if: hashFiles('review.md') != ''
        run: |
          gh label create bst-radio-review --repo "$REPO" --color d93f0b \
            --description "BST Radio stations to look at" --force > /dev/null
          title=$(head -n 1 review.md)
          tail -n +3 review.md > body.md
          open=$(gh issue list --repo "$REPO" --label bst-radio-review --state open --json number --jq '.[0].number // empty')
          if [ -z "$open" ]; then
            gh issue create --repo "$REPO" --title "$title" --body-file body.md --label bst-radio-review \
              --assignee "${{ github.repository_owner }}"
          else
            gh issue edit "$open" --repo "$REPO" --title "$title" --body-file body.md
          fi
